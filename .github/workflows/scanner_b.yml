name: Scanner B - Discovery

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "config.json"
      - "requirements.txt"
      - ".github/workflows/scanner_b.yml"
  schedule:
    # Toronto 02:15. Keep both UTC entries for DST, but select by Toronto's
    # current UTC offset instead of the workflow's actual start hour. GitHub
    # scheduled runs can be delayed, so checking wall-clock start time is not reliable.
    - cron: "15 6 * * *"
    - cron: "15 7 * * *"

permissions:
  contents: write

concurrency:
  group: scanner-b-discovery-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Toronto schedule guard
        id: guard
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TORONTO_OFFSET=$(TZ=America/Toronto date +%z)
          SCHEDULE="${{ github.event.schedule }}"

          # EDT (UTC-4): 02:15 Toronto == 06:15 UTC.
          # EST (UTC-5): 02:15 Toronto == 07:15 UTC.
          # Key point: choose from the scheduled cron expression, not the
          # workflow's delayed wall-clock start time.
          if { [ "$TORONTO_OFFSET" = "-0400" ] && [ "$SCHEDULE" = "15 6 * * *" ]; } || \
             { [ "$TORONTO_OFFSET" = "-0500" ] && [ "$SCHEDULE" = "15 7 * * *" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Syntax check
        if: steps.guard.outputs.run == 'true'
        run: python -m py_compile scanner_common.py collect_external.py collect_external_safe.py news_rss.py collect_rss.py clean_events.py rank_candidates.py rank_rss.py rank_for_judge.py make_judge_review.py youtube_enrich.py

      - name: Collect external catalysts
        if: steps.guard.outputs.run == 'true'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'youtube-catalyst-scanner/1.0 70549770+pianissix7mo@users.noreply.github.com' }}
        run: python collect_rss.py

      - name: Clean and disambiguate events
        if: steps.guard.outputs.run == 'true'
        run: python clean_events.py

      - name: Build baseline and prepare Judge B candidates
        if: steps.guard.outputs.run == 'true'
        run: python rank_for_judge.py

      - name: Build compact Judge B review file
        if: steps.guard.outputs.run == 'true'
        run: python make_judge_review.py

      - name: Upload discovery artifact
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scanner-b-discovery-latest
          path: |
            data/raw_events.json
            data/judge_candidates.json
            data/judge_review.jsonl
            data/baseline_history.json
          retention-days: 14

      - name: Commit discovery state
        if: steps.guard.outputs.run == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw_events.json data/judge_candidates.json data/judge_review.jsonl data/baseline_history.json
          if git diff --cached --quiet; then
            echo "No generated discovery changes to commit"
            exit 0
          fi
          git commit -m "Update Scanner B discovery candidates"
          git push
