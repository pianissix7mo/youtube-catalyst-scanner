name: Scanner B - CI

on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "config.json"
      - ".github/workflows/*.yml"
  pull_request:
    paths:
      - "*.py"
      - "config.json"
      - ".github/workflows/*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile scanner_common.py collect_external.py collect_external_safe.py news_rss.py collect_rss.py clean_events.py rank_candidates.py rank_rss.py rank_for_judge.py make_judge_review.py youtube_enrich.py test_scanner.py

      - name: Regression tests
        run: python -m unittest -v test_scanner.py
