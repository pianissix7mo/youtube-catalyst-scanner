name: Scanner B - YouTube Enrichment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/selected_events.json"

permissions:
  contents: write

concurrency:
  group: scanner-b-enrichment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile scanner_common.py collect_rss.py collect_external.py news_rss.py rank_candidates.py rank_rss.py rank_for_judge.py youtube_enrich.py test_scanner.py

      - name: Regression tests
        run: python -m unittest -v test_scanner.py

      - name: Validate Judge B selection
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scanner_common import load_config
          from youtube_enrich import validate_selected_payload

          p = Path('data/selected_events.json')
          c = Path('data/judge_candidates.json')
          if not p.exists() or not c.exists():
              raise SystemExit('selected_events.json or judge_candidates.json missing')
          data = json.loads(p.read_text(encoding='utf-8'))
          candidates = json.loads(c.read_text(encoding='utf-8'))
          validate_selected_payload(data, candidates, load_config())
          if data.get('judge_version') != 'B_V1':
              raise SystemExit('selected_events.json was not produced by Judge B V1')
          events = data.get('events') or []
          if len(events) > 20:
              raise SystemExit(f'Judge B selected {len(events)} events; hard limit is 20')
          for row in events:
              if row.get('entity_accuracy') != 'pass':
                  raise SystemExit('Judge B output contains entity_accuracy != pass')
              if float(row.get('judge_score') or 0) < 58:
                  raise SystemExit('Judge B output contains judge_score below 58')
          print(f'Validated {len(events)} Judge B events')
          PY

      - name: Check selection is still current
        id: current
        shell: bash
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          if git diff --quiet HEAD "origin/$GITHUB_REF_NAME" -- data/selected_events.json; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "A newer selected_events.json exists; skipping stale enrichment."
          fi

      - name: YouTube supply-gap enrichment
        if: steps.current.outputs.run == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python youtube_enrich.py

      - name: Upload enrichment artifact
        if: steps.current.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scanner-b-enrichment-latest
          path: |
            data/selected_events.json
            output/latest.json
            output/latest.md
          retention-days: 14

      - name: Commit enrichment output
        if: steps.current.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          if ! git diff --quiet HEAD "origin/$GITHUB_REF_NAME" -- data/selected_events.json; then
            echo "Selection changed during enrichment; refusing to commit stale output."
            exit 0
          fi
          git add output/latest.json output/latest.md
          if git diff --cached --quiet; then
            echo "No enrichment changes to commit"
            exit 0
          fi
          git commit -m "Update Scanner B YouTube enrichment"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
